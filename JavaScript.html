<script>
const OPTS={
 tipos:['Bombero','Insigne','Honorario','Aspirante','Cadete o Brigadier','Otro'],
 situaciones:['Activo','No Activo','Retirado','Expulsado','Separado','Fallecido'],
 academico:['Bombero Postulante','Bombero Inicial','Bombero Operativo','Bombero Profesional','Especialidad'],
 cargos:['Sin cargo','Superintendente','Vicesuperintendente','Tesorero General','Secretario General','Ayudante General','Comandante','Inspector de Máquinas','Director','Capitán','Teniente','Secretario de Compañía','Tesorero de Compañía','Ayudante de Compañía','Jefe de Máquinas'],
 estadosMaterial:['Bueno','Regular','Malo','Dado de baja','Devuelto']
};
const state={token:'',user:null,bomberos:[],academico:[],material:[],usuarios:[],page:'dashboard',theme:localStorage.getItem('bomberos-theme')||'green',query:'',filterSituacion:'',filterTipo:'',filterCargo:'',editing:null,detail:null,detailTab:'datos'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateFmt=s=>s?new Date(String(s).length===10?s+'T12:00:00':s).toLocaleDateString('es-CL'):'—';
function api(action,data={}){return new Promise((resolve,reject)=>{if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(r=>r&&r.ok?resolve(r.data):reject(new Error(r?.error||'Error de servidor'))).withFailureHandler(e=>reject(new Error(e.message||'Error de conexión'))).api({action,token:state.token,...data});}else{reject(new Error('La aplicación no está conectada a Apps Script. Despliegue Index.html y Code.gs como aplicación web de Google Apps Script.'));}})}
function toast(msg,bad=false){$('#toast-root').innerHTML=`<div class="toast ${bad?'bad':''}">${esc(msg)}</div>`;setTimeout(()=>$('#toast-root').innerHTML='',3500)}
function initials(b){return ((b.nombres||'?').trim()[0]||'')+((b.apellidos||'').trim()[0]||'')}
function fullName(b){return `${b.nombres||''} ${b.apellidos||''}`.trim()}
function photo(b,size='avatar'){return b.fotoUrl?`<div class="${size}"><img src="${esc(b.fotoUrl)}" alt="Fotografía de ${esc(fullName(b))}"></div>`:`<div class="${size}">${esc(initials(b)||'👨‍🚒')}</div>`}
function pill(s){let c=s==='Activo'||s==='Bueno'?'':(['Retirado','Expulsado','Fallecido','Dado de baja'].includes(s)?'red':(['No Activo','Separado','Regular'].includes(s)?'amber':'gray'));return `<span class="pill ${c}">${esc(s||'Sin dato')}</span>`}
function setTheme(t){state.theme=t;localStorage.setItem('bomberos-theme',t);document.documentElement.dataset.theme=t==='blue'?'blue':'';if(state.user)render()}
function loginView(){return `<div class="login-wrap"><section class="login-art"><div><div class="brand-mark">🚒</div><h1>Registro institucional<br>de Bomberos</h1><p>Una plataforma para organizar la hoja de vida, formación, equipamiento y trayectoria de cada integrante de la Tercera Compañía de Bomberos de Carelmapu.</p></div><div style="font-size:12px;color:#d9f6e5">TERCERA COMPAÑÍA · CARELMAPU</div></section><section class="login-right"><form class="login-card" id="login-form"><div class="eyebrow">Acceso institucional</div><h2>Bienvenido</h2><p class="muted" style="margin:0 0 28px">Ingrese sus credenciales para continuar.</p><div class="field"><label>Usuario</label><input name="usuario" autocomplete="username" required placeholder="Nombre de usuario"></div><div class="field"><label>Contraseña</label><input name="password" type="password" autocomplete="current-password" required placeholder="Su contraseña"></div><div id="login-error" class="error"></div><button class="btn btn-primary full" type="submit">Iniciar sesión <span>→</span></button><p class="muted" style="font-size:11px;line-height:1.6;margin-top:20px">Sistema de acceso restringido. Si no tiene una cuenta, contacte al administrador institucional.</p></form></section></div>`}
function render(){document.documentElement.dataset.theme=state.theme==='blue'?'blue':'';if(!state.user){$('#app').innerHTML=loginView();$('#login-form').addEventListener('submit',doLogin);return}
const nav=[['dashboard','📱','Panel principal'],['bomberos','🧑‍🚒','Registro de bomberos'],['academico','📑','Historial académico'],['material','⛑️','Material a cargo'],...(state.user.rol==='Administrador'?[['usuarios','🪪','Usuarios y roles']]:[])];
$('#app').innerHTML=`<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">🧑‍🚒</div><div><strong>REGISTRO BOMBERIL</strong><small>3.ª Compañía · Carelmapu</small></div></div><div><div class="nav-label">MENÚ PRINCIPAL</div><nav class="nav">${nav.map(n=>`<button class="${state.page===n[0]?'active':''}" data-page="${n[0]}"><span class="ico">${n[1]}</span>${n[2]}</button>`).join('')}</nav></div><div class="side-bottom"><div class="nav-label">PREFERENCIAS</div><div class="nav"><button id="theme-side"><span class="ico">◐</span>Cambiar a tema ${state.theme==='green'?'azul':'verde'}</button><button id="password-btn"><span class="ico">🔏</span>Cambiar contraseña</button></div><div class="user-mini">${photo({nombres:state.user.nombre||state.user.usuario,apellidos:''})}<div style="min-width:0"><strong>${esc(state.user.nombre||state.user.usuario)}</strong><small>${esc(state.user.rol)}</small></div></div></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn btn-outline mobile-menu" id="menu-btn">☰</button><div><h2>${({dashboard:'Panel principal',bomberos:'Registro general de bomberos',academico:'Historial académico',material:'Material a cargo',usuarios:'Usuarios y permisos'})[state.page]}</h2><div class="sub">Tercera Compañía de Bomberos de Carelmapu</div></div></div><div class="top-actions"><button class="theme-toggle" id="theme-top" title="Cambiar colores">${state.theme==='green'?'🟢':'🔵'} <span class="user-label">${state.theme==='green'?'Verde':'Azul'}</span></button><button class="btn btn-outline btn-sm" id="logout-btn">↪ Salir</button></div></header><section class="content">${pageContent()}</section></main></div>`;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.query='';render()});
$('#theme-side').onclick=()=>setTheme(state.theme==='green'?'blue':'green');$('#theme-top').onclick=()=>setTheme(state.theme==='green'?'blue':'green');$('#logout-btn').onclick=logout;$('#password-btn').onclick=passwordModal;
const mb=$('#menu-btn');if(mb)mb.onclick=()=>$('#sidebar').classList.toggle('open');
bindPage();
document.onkeydown=e=>{if(e.key==='Escape'){const mr=$('#modal-root');if(mr)mr.innerHTML='';const sb=$('#sidebar');if(sb)sb.classList.remove('open')}};
}
function pageContent(){
if(state.page==='dashboard')return dashboard();
if(state.page==='bomberos')return bomberosPage();
if(state.page==='academico')return recordsPage('academico');
if(state.page==='material')return recordsPage('material');
if(state.page==='usuarios')return usersPage();
return '';
}
function dashboard(){const active=state.bomberos.filter(b=>b.situacion==='Activo').length,asp=state.bomberos.filter(b=>b.tipoBombero==='Aspirante'||b.tipoBombero==='Cadete o Brigadier').length,academy=state.academico.length,assigned=state.material.filter(m=>!m.fechaDevolucion&&m.estado!=='Devuelto').length;
return `<div class="page-head"><div><h1>Resumen institucional</h1><p>Indicadores generales y actividad del registro de la compañía.</p></div><button class="btn btn-primary" data-new-bombero>＋ Registrar bombero</button></div><div class="stats"><div class="stat"><div class="stat-top">Total registrados <span class="stat-icon">🗃️</span></div><strong>${state.bomberos.length}</strong><small>Integrantes en el sistema</small></div><div class="stat"><div class="stat-top">Bomberos activos <span class="stat-icon">✅</span></div><strong>${active}</strong><small>${state.bomberos.length?Math.round(active/state.bomberos.length*100):0}% del registro general</small></div><div class="stat"><div class="stat-top">Aspirantes y cadetes <span class="stat-icon">🐥</span></div><strong>${asp}</strong><small>En proceso de formación</small></div><div class="stat"><div class="stat-top">Registros académicos <span class="stat-icon">🎓</span></div><strong>${academy}</strong><small>${assigned} materiales asignados</small></div></div><div class="panel"><div class="panel-head"><h3>Últimos integrantes registrados</h3><button class="btn btn-quiet btn-sm" data-go-bomberos>Ver registro completo →</button></div>${tableBomberos(state.bomberos.slice().sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))).slice(0,6),true)}</div><div class="note" style="margin-top:18px">Consejo: mantenga actualizados los datos de contacto, la situación institucional, las capacitaciones y el material asignado. Los permisos de edición dependen del rol de usuario.</div>`}
function bomberosPage(){return `<div class="page-head"><div><h1>Registro general</h1><p>Consulte y administre la hoja de vida de los integrantes.</p></div><div class="toolbar"><button class="btn btn-outline" id="export-excel">⬇️ Excel</button><button class="btn btn-outline" id="export-pdf-list">⬇️ PDF</button>${canEdit()?'<button class="btn btn-primary" data-new-bombero>＋ Nuevo bombero</button>':''}</div></div><div class="panel"><div class="panel-head"><h3>Listado de bomberos <span class="muted">(${filteredBomberos().length})</span></h3><input class="search-input" id="search-bomberos" placeholder="🔎 Buscar nombre, RUT, código radial…" value="${esc(state.query)}"></div><div class="panel-body" style="padding-bottom:0"><div class="filters"><select id="filter-situacion"><option value="">Todas las situaciones</option>${OPTS.situaciones.map(x=>`<option ${state.filterSituacion===x?'selected':''}>${x}</option>`).join('')}</select><select id="filter-tipo"><option value="">Todos los tipos</option>${OPTS.tipos.map(x=>`<option ${state.filterTipo===x?'selected':''}>${x}</option>`).join('')}</select><select id="filter-cargo"><option value="">Todos los cargos</option>${OPTS.cargos.map(x=>`<option ${state.filterCargo===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn btn-outline btn-sm" id="clear-filters">Limpiar filtros</button></div></div>${tableBomberos(filteredBomberos())}</div>`}
function filteredBomberos(){const q=state.query.toLowerCase().trim();return state.bomberos.filter(b=>(!q||[fullName(b),b.rut,b.codigoRadial,b.email,b.telefono,b.cargoInstitucional].some(x=>String(x||'').toLowerCase().includes(q)))&&(!state.filterSituacion||b.situacion===state.filterSituacion)&&(!state.filterTipo||b.tipoBombero===state.filterTipo)&&(!state.filterCargo||b.cargoInstitucional===state.filterCargo)).sort((a,b)=>fullName(a).localeCompare(fullName(b),'es'))}
function tableBomberos(rows,compact=false){return `<div class="table-wrap"><table><thead><tr><th>Bombero</th><th>RUT</th><th>Código radial</th><th>Tipo</th><th>Situación</th><th>Cargo</th><th>Acciones</th></tr></thead><tbody>${rows.length?rows.map(b=>`<tr><td><div class="person">${photo(b)}<div><strong>${esc(fullName(b))}</strong><small>Ingreso: ${dateFmt(b.fechaIngreso)}</small></div></div></td><td>${esc(b.rut||'—')}</td><td><strong>${esc(b.codigoRadial||'—')}</strong></td><td>${esc(b.tipoBombero||'—')}</td><td>${pill(b.situacion)}</td><td>${esc(b.cargoInstitucional||'Sin cargo')}</td><td><div class="row-actions"><button class="icon-btn" title="Ver hoja de vida" data-detail="${esc(b.id)}">👁️‍🗨️</button>${canEdit()?`<button class="icon-btn" title="Editar" data-edit="${esc(b.id)}">✏️</button>`:''}<button class="icon-btn" title="PDF hoja de vida" data-pdf="${esc(b.id)}">⬇️</button></div></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty"><div class="big">♙</div><strong>No hay registros para mostrar</strong><p>Pruebe modificando los filtros o registre un integrante.</p></div></td></tr>`}</tbody></table></div>`}
function recordsPage(kind){const isA=kind==='academico',rows=isA?state.academico:state.material;return `<div class="page-head"><div><h1>${isA?'Historial académico':'Material a cargo'}</h1><p>${isA?'Cursos, niveles de formación y especialidades de los bomberos.':'Control de los materiales entregados y asignados a cada integrante.'}</p></div><div class="toolbar"><button class="btn btn-outline" id="export-records">⬇️ Exportar Excel</button>${canEdit()?`<button class="btn btn-primary" id="add-record">＋ ${isA?'Agregar formación':'Asignar material'}</button>`:''}</div></div><div class="panel"><div class="panel-head"><h3>${isA?'Registros Académicos':'Materiales registrados'} (${rows.length})</h3><input class="search-input" id="record-search" placeholder="🔎 Buscar por bombero o registro…"></div><div class="table-wrap"><table><thead><tr>${isA?'<th>Bombero</th><th>Fecha</th><th>Tipo</th><th>Curso / especialidad</th><th>Institución</th><th>Resultado</th>':'<th>Bombero</th><th>Fecha entrega</th><th>Material</th><th>Categoría</th><th>Estado</th><th>N.º serie</th><th>Devolución</th>'}<th>Acciones</th></tr></thead><tbody id="records-body">${recordsRows(rows,kind)}</tbody></table></div></div>`}
function recordsRows(rows,kind){const isA=kind==='academico';return rows.length?rows.map(r=>{const b=state.bomberos.find(x=>x.id===r.bomberoId)||{};return `<tr data-record-row data-search="${esc((fullName(b)+' '+Object.values(r).join(' ')).toLowerCase())}"><td>${esc(fullName(b)||'Bombero no encontrado')}</td>${isA?`<td>${dateFmt(r.fecha)}</td><td>${esc(r.tipo||'—')}</td><td>${esc(r.cursoEspecialidad||'—')}</td><td>${esc(r.institucion||'—')}</td><td>${esc(r.resultado||'—')}</td>`:`<td>${dateFmt(r.fechaEntrega)}</td><td>${esc(r.material||'—')}</td><td>${esc(r.categoria||'—')}</td><td>${pill(r.estado||'Sin dato')}</td><td>${esc(r.numeroSerie||'—')}</td><td>${dateFmt(r.fechaDevolucion)}</td>`}<td><div class="row-actions">${canEdit()?`<button class="icon-btn" data-edit-record="${esc(r.id)}" data-kind="${kind}" title="Editar">✏️</button><button class="icon-btn" data-delete-record="${esc(r.id)}" data-kind="${kind}" title="Eliminar">⛔</button>`:'—'}</div></td></tr>`}).join(''):`<tr><td colspan="${isA?7:8}"><div class="empty"><div class="big">${isA?'▤':'▣'}</div><strong>Sin registros</strong><p>Los registros aparecerán aquí al agregarlos.</p></div></td></tr>`}
function usersPage(){return `<div class="page-head"><div><h1>Usuarios y permisos</h1><p>Gestione el acceso al registro institucional según las responsabilidades.</p></div><button class="btn btn-primary" id="add-user">＋ Crear usuario</button></div><div class="panel"><div class="panel-head"><h3>Usuarios del sistema</h3><span class="muted">${state.usuarios.length} usuarios</span></div><div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${state.usuarios.map(u=>`<tr><td><strong>${esc(u.usuario)}</strong></td><td>${esc(u.nombre)}</td><td>${pill(u.rol)}</td><td>${u.activo===false||String(u.activo)==='false'?pill('No Activo'):pill('Activo')}</td><td><button class="btn btn-outline btn-sm" data-edit-user="${esc(u.id)}">Editar</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No hay usuarios cargados.</td></tr>'}</tbody></table></div></div><div class="note" style="margin-top:16px">Administrador: administra usuarios y todos los registros. Oficial: crea y actualiza hojas de vida, formación y material. Consulta: solo visualiza y exporta información.</div>`}
function canEdit(){return ['Administrador','Oficial'].includes(state.user?.rol)}
function bindPage(){
document.querySelectorAll('[data-new-bombero]').forEach(b=>b.onclick=()=>bomberoModal());
document.querySelectorAll('[data-go-bomberos]').forEach(b=>b.onclick=()=>{state.page='bomberos';render()});
document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detailModal(b.dataset.detail));
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>bomberoModal(b.dataset.edit));
document.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>exportBomberoPDF(b.dataset.pdf));
const q=$('#search-bomberos');if(q)q.oninput=e=>{state.query=e.target.value;const pos=e.target.selectionStart;const wrap=$('.panel .table-wrap');const old=wrap?.scrollLeft;const table=tableBomberos(filteredBomberos());$('.panel .table-wrap').outerHTML?null:null;document.querySelector('.panel .table-wrap').outerHTML=table;bindTableActions();const inp=$('#search-bomberos');inp.focus();inp.setSelectionRange(pos,pos);document.querySelector('.panel .table-wrap').scrollLeft=old||0};
['situacion','tipo','cargo'].forEach(k=>{const el=$('#filter-'+k);if(el)el.onchange=()=>{state['filter'+k[0].toUpperCase()+k.slice(1)]=el.value;const wrap=document.querySelector('.panel .table-wrap');wrap.outerHTML=tableBomberos(filteredBomberos());bindTableActions();}});
if($('#clear-filters'))$('#clear-filters').onclick=()=>{state.query='';state.filterSituacion=state.filterTipo=state.filterCargo='';render()};
if($('#export-excel'))$('#export-excel').onclick=exportExcel;
if($('#export-pdf-list'))$('#export-pdf-list').onclick=exportListPDF;
if($('#add-record'))$('#add-record').onclick=()=>recordModal(state.page);
if($('#record-search'))$('#record-search').oninput=e=>document.querySelectorAll('[data-record-row]').forEach(r=>r.style.display=r.dataset.search.includes(e.target.value.toLowerCase())?'':'none');
if($('#export-records'))$('#export-records').onclick=()=>exportRecordsExcel(state.page);
document.querySelectorAll('[data-edit-record]').forEach(b=>b.onclick=()=>recordModal(b.dataset.kind,b.dataset.editRecord));
document.querySelectorAll('[data-delete-record]').forEach(b=>b.onclick=()=>deleteRecord(b.dataset.kind,b.dataset.deleteRecord));
if($('#add-user'))$('#add-user').onclick=()=>userModal();
document.querySelectorAll('[data-edit-user]').forEach(b=>b.onclick=()=>userModal(b.dataset.editUser));
bindTableActions();
}
function bindTableActions(){document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detailModal(b.dataset.detail));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>bomberoModal(b.dataset.edit));document.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>exportBomberoPDF(b.dataset.pdf))}
function doLogin(e){e.preventDefault();const f=new FormData(e.target);$('#login-error').textContent='';api('login',{usuario:f.get('usuario'),password:f.get('password')}).then(r=>{state.token=r.token;state.user=r.user;return refresh()}).then(()=>toast('Sesión iniciada correctamente')).catch(err=>$('#login-error').textContent=err.message)}
function refresh(){return api('bootstrap').then(d=>{state.user=d.user;state.bomberos=d.bomberos||[];state.academico=d.academico||[];state.material=d.material||[];state.usuarios=d.usuarios||[];render()})}
function logout(){api('logout').catch(()=>{});state.token='';state.user=null;render()}
function bomberoModal(id){if(!canEdit())return;const b=id?state.bomberos.find(x=>x.id===id):{};state.editing=b||{};const select=(opts,val)=>opts.map(o=>`<option ${String(val||'')===o?'selected':''}>${esc(o)}</option>`).join('');
$('#modal-root').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal"><div class="modal-head"><h3>${id?'Editar hoja de vida':'Registrar nuevo bombero'}</h3><button class="icon-btn" id="close-modal">×</button></div><form id="bombero-form"><div class="modal-body"><div class="photo-upload">${photo(b,'photo-large')}<div><strong>Fotografía del bombero</strong><p class="muted" style="font-size:12px;margin:5px 0 8px">JPG, PNG o WEBP · máximo 5 MB</p><input type="file" id="photo-file" accept="image/jpeg,image/png,image/webp"></div></div><input type="hidden" name="id" value="${esc(b.id||'')}"><input type="hidden" name="fotoUrl" value="${esc(b.fotoUrl||'')}"><div class="form-grid"><div class="section-label">Identificación personal</div><div class="field"><label>Nombres *</label><input name="nombres" required value="${esc(b.nombres||'')}"></div><div class="field"><label>Apellidos *</label><input name="apellidos" required value="${esc(b.apellidos||'')}"></div><div class="field"><label>RUT</label><input name="rut" value="${esc(b.rut||'')}" placeholder="12.345.678-9"></div><div class="field"><label>Fecha de nacimiento</label><input name="fechaNacimiento" type="date" value="${esc(b.fechaNacimiento||'')}"></div><div class="field"><label>Fecha de ingreso</label><input name="fechaIngreso" type="date" value="${esc(b.fechaIngreso||'')}"></div><div class="field"><label>Grupo sanguíneo</label><select name="grupoSanguineo"><option value="">Seleccione</option>${['O+','O-','A+','A-','B+','B-','AB+','AB-','No informado'].map(o=>`<option ${b.grupoSanguineo===o?'selected':''}>${o}</option>`).join('')}</select></div><div class="section-label">Situación institucional</div><div class="field"><label>Tipo de bombero</label><select name="tipoBombero">${select(OPTS.tipos,b.tipoBombero||'Bombero')}</select></div><div class="field"><label>Situación</label><select name="situacion">${select(OPTS.situaciones,b.situacion||'Activo')}</select></div><div class="field"><label>Cargo institucional</label><select name="cargoInstitucional">${select(OPTS.cargos,b.cargoInstitucional||'Sin cargo')}</select></div><div class="field"><label>Código radial</label><input name="codigoRadial" value="${esc(b.codigoRadial||'')}" placeholder="Ej. K-3"></div><div class="section-label">Contacto</div><div class="field"><label>Teléfono</label><input name="telefono" type="tel" value="${esc(b.telefono||'')}"></div><div class="field"><label>Correo electrónico</label><input name="email" type="email" value="${esc(b.email||'')}"></div><div class="field fullspan"><label>Dirección</label><input name="direccion" value="${esc(b.direccion||'')}"></div><div class="field"><label>Contacto de emergencia</label><input name="contactoEmergencia" value="${esc(b.contactoEmergencia||'')}"></div><div class="field"><label>Teléfono de emergencia</label><input name="telefonoEmergencia" value="${esc(b.telefonoEmergencia||'')}"></div><div class="field fullspan"><label>Observaciones de hoja de vida</label><textarea name="observaciones" rows="3">${esc(b.observaciones||'')}</textarea></div></div><div class="error" id="form-error"></div></div><div class="modal-foot"><button type="button" class="btn btn-outline" id="cancel-modal">Cancelar</button><button class="btn btn-primary" type="submit">Guardar hoja de vida</button></div></form></div></div>`;

function recordModal(kind,id){const isA=kind==='academico';const rows=isA?state.academico:state.material;const r=id?rows.find(x=>x.id===id):{};const bOpts=state.bomberos.map(b=>`<option value="${esc(b.id)}" ${r.bomberoId===b.id?'selected':''}>${esc(fullName(b))}</option>`).join('');$('#modal-root').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal" style="max-width:680px"><div class="modal-head"><h3>${id?'Editar':'Agregar'} ${isA?'formación académica':'material asignado'}</h3><button class="icon-btn" id="close-modal">×</button></div><form id="record-form"><div class="modal-body"><input type="hidden" name="id" value="${esc(r.id||'')}"><div class="form-grid"><div class="field fullspan"><label>Bombero *</label><select name="bomberoId" required><option value="">Seleccione un bombero</option>${bOpts}</select></div>${isA?`<div class="field"><label>Fecha</label><input name="fecha" type="date" value="${esc(r.fecha||'')}"></div><div class="field"><label>Tipo de formación *</label><select name="tipo" required>${OPTS.academico.map(x=>`<option ${r.tipo===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Curso / especialidad</label><input name="cursoEspecialidad" value="${esc(r.cursoEspecialidad||'')}"></div><div class="field"><label>Institución</label><input name="institucion" value="${esc(r.institucion||'')}"></div><div class="field"><label>Resultado / certificación</label><input name="resultado" value="${esc(r.resultado||'')}"></div><div class="field"><label>Horas</label><input name="horas" type="number" min="0" value="${esc(r.horas||'')}"></div><div class="field fullspan"><label>Observaciones</label><textarea name="observaciones">${esc(r.observaciones||'')}</textarea></div>`:`<div class="field"><label>Fecha de entrega</label><input name="fechaEntrega" type="date" value="${esc(r.fechaEntrega||'')}"></div><div class="field"><label>Material *</label><input name="material" required value="${esc(r.material||'')}"></div><div class="field"><label>Categoría</label><input name="categoria" value="${esc(r.categoria||'')}" placeholder="EPP, herramienta, radio…"></div><div class="field"><label>Marca / modelo</label><input name="marcaModelo" value="${esc(r.marcaModelo||'')}"></div><div class="field"><label>Número de serie / inventario</label><input name="numeroSerie" value="${esc(r.numeroSerie||'')}"></div><div class="field"><label>Estado</label><select name="estado">${OPTS.estadosMaterial.map(x=>`<option ${r.estado===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Fecha de devolución</label><input name="fechaDevolucion" type="date" value="${esc(r.fechaDevolucion||'')}"></div><div class="field fullspan"><label>Observaciones</label><textarea name="observaciones">${esc(r.observaciones||'')}</textarea></div>`}</div><div class="error" id="form-error"></div></div><div class="modal-foot"><button type="button" class="btn btn-outline" id="cancel-modal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar registro</button></div></form></div></div>`;closeModalBindings();$('#record-form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());try{await api(isA?'saveAcademico':'saveMaterial',{data:d});$('#modal-root').innerHTML='';await refresh();toast('Registro guardado')}catch(err){$('#form-error').textContent=err.message}}}

function exportExcel(){if(!window.XLSX)return toast('No se pudo cargar el módulo Excel',true);const rows=filteredBomberos().map(b=>({'Nombres':b.nombres,'Apellidos':b.apellidos,'RUT':b.rut,'Fecha nacimiento':b.fechaNacimiento,'Fecha ingreso':b.fechaIngreso,'Tipo':b.tipoBombero,'Situación':b.situacion,'Código radial':b.codigoRadial,'Cargo':b.cargoInstitucional,'Teléfono':b.telefono,'Correo':b.email,'Dirección':b.direccion,'Grupo sanguíneo':b.grupoSanguineo,'Contacto emergencia':b.contactoEmergencia,'Teléfono emergencia':b.telefonoEmergencia,'Observaciones':b.observaciones}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Registro general');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(state.academico.map(r=>({...r,nombreBombero:fullName(state.bomberos.find(b=>b.id===r.bomberoId)||{})}))),'Historial académico');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(state.material.map(r=>({...r,nombreBombero:fullName(state.bomberos.find(b=>b.id===r.bomberoId)||{})}))),'Material a cargo');XLSX.writeFile(wb,'Registro_Bomberos_Carelmapu.xlsx');}

function exportListPDF(){if(!window.jspdf)return toast('No se pudo cargar el módulo PDF',true);const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'landscape'});doc.setFontSize(16);doc.text('Registro General de Bomberos',14,16);doc.setFontSize(9);doc.text('Tercera Compañía de Bomberos de Carelmapu · '+new Date().toLocaleDateString('es-CL'),14,23);doc.autoTable({startY:29,head:[['Nombre completo','RUT','Código radial','Tipo','Situación','Cargo','Teléfono','Ingreso']],body:filteredBomberos().map(b=>[fullName(b),b.rut||'',b.codigoRadial||'',b.tipoBombero||'',b.situacion||'',b.cargoInstitucional||'',b.telefono||'',b.fechaIngreso||'']),styles:{fontSize:7,cellPadding:2},headStyles:{fillColor:state.theme==='blue'?[38,116,217]:[45,155,101]}});doc.save('Registro_General_Bomberos_Carelmapu.pdf')}
function exportBomberoPDF(id){const b=state.bomberos.find(x=>x.id===id);if(!b||!window.jspdf)return toast('No se pudo generar el PDF',true);const {jsPDF}=window.jspdf;const doc=new jsPDF();const acad=state.academico.filter(x=>x.bomberoId===id),mat=state.material.filter(x=>x.bomberoId===id);const green=state.theme==='blue'?[38,116,217]:[45,155,101];doc.setFillColor(...green);doc.rect(0,0,210,34,'F');doc.setTextColor(255,255,255);doc.setFontSize(16);doc.text('HOJA DE VIDA DEL BOMBERO',14,15);doc.setFontSize(9);doc.text('Tercera Compañía de Bomberos de Carelmapu',14,24);doc.setTextColor(30,45,35);doc.setFontSize(15);doc.text(fullName(b),14,46);doc.setFontSize(9);doc.text('Tipo: '+(b.tipoBombero||'—')+'   |   Situación: '+(b.situacion||'—')+'   |   Código radial: '+(b.codigoRadial||'—'),14,54);doc.autoTable({startY:60,head:[['Dato','Información','Dato','Información']],body:[['RUT',b.rut||'—','Cargo',b.cargoInstitucional||'—'],['Fecha de nacimiento',b.fechaNacimiento||'—','Fecha de ingreso',b.fechaIngreso||'—'],['Teléfono',b.telefono||'—','Correo',b.email||'—'],['Dirección',b.direccion||'—','Grupo sanguíneo',b.grupoSanguineo||'—'],['Contacto emergencia',b.contactoEmergencia||'—','Teléfono emergencia',b.telefonoEmergencia||'—'],['Observaciones',b.observaciones||'—','','']],styles:{fontSize:8,cellPadding:3},headStyles:{fillColor:green},columnStyles:{0:{fontStyle:'bold'},2:{fontStyle:'bold'}}});let y=doc.lastAutoTable.finalY+10;doc.setFontSize(12);doc.text('Historial académico',14,y);doc.autoTable({startY:y+4,head:[['Fecha','Tipo','Curso / especialidad','Institución','Resultado','Horas']],body:acad.map(x=>[x.fecha||'',x.tipo||'',x.cursoEspecialidad||'',x.institucion||'',x.resultado||'',x.horas||'']),styles:{fontSize:7,cellPadding:2},headStyles:{fillColor:green},showHead:'everyPage'});y=doc.lastAutoTable.finalY+10;if(y>255){doc.addPage();y=18}doc.setFontSize(12);doc.text('Material a cargo',14,y);doc.autoTable({startY:y+4,head:[['Fecha entrega','Material','Categoría','Estado'
